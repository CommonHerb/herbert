name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: make check
        run: make check
      - name: verification helpers
        run: make verification-helpers
      - name: timeout shim
        run: make test-timeout
      - name: make test
        run: make test
      - name: Herbert word counter
        run: make wordcount
      - name: Hosted reusable memory and Linux calls
        run: make hosted-memory-io
      - name: install independent desktop test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxtst6
      - name: Herbert interactive desktop and sustained memory
        run: make check-desktop
      - name: install compiler fault-test tools
        run: sudo apt-get update && sudo apt-get install -y gdb strace binutils
      - name: Herbert reusable map, text and atomic-file support
        run: make check-app-support
      - name: Herbert maze and notes interaction and sustained memory
        run: make check-hosted-apps
      - name: compiler invocation fault contract
        run: make compiler-cli-contract
      # verify-local suites CI historically skipped (2026-07-03 canon-cleanup, §4). The
      # emulator-free ones run here; native-codegen-diagnostics needs QEMU so it runs in
      # kernel-codegen-l1.yml.
      - name: error-vocab-native (C-free front-end error vocabulary + mutation)
        run: make error-vocab-native
      - name: lexer-copy-sync (copied lexer blocks match the fragment contract)
        run: make lexer-copy-sync
      # switchover-dry-run: the standing C-creep-back guard -- proves the 7 rehomed C-free
      # bite-proofs still bite with C PHYSICALLY ABSENT, plus its 5-mutation bite-proof. Was
      # HELD OUT of CI pending a fix to a klaxon/link19 manifest drift: a BORN-C-free bite-proof
      # (run_error_vocab_native_mutation.sh) was added to the CFREE_BITEPROOF disposition but has
      # no retireable C leg, breaking the exact-membership pin. FIXED 2026-07-03 -- the dry-run now
      # derives its frozen set from CFREE_BITEPROOFs that carry a retireable C cross-check (manifest
      # column-4 mode-env != "-"); mutation proof bites 6/6. Needs no emulator and no build/herbert
      # (a fresh checkout has none), so it runs in this emulator-free job.
      - name: switchover-dry-run (C-free bite-proofs survive C's removal + mutation proof)
        run: make switchover-dry-run
      - name: retain hosted application test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-application-evidence
          path: |
            /tmp/herbert-hosted-apps-*/
            /tmp/herbert-notes-support-*/
            /tmp/herbert-x11-text-check-*/
            /tmp/herbert-desktop-check-*/
            /tmp/herbert-grid-map-*/
            /tmp/herbert-conformance.*/
            /tmp/herbert-stdin-contract.*/
            /tmp/herbert-cli-contract.*/
            /tmp/herbert-hosted-memory-*/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
