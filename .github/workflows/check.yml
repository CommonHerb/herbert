name: check

on:
  push:
  pull_request:

jobs:
  check:
    # Package versions below are observed in each run, not guessed or claimed
    # as locked dependencies.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: install the display server the window checks start
        run: |
          sudo apt-get update
          sudo apt-get install -y make xvfb
      - name: record actual hosted test environment
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          dpkg-query -W -f='${Package}=${Version}\n' bash coreutils make git xvfb
          make --version
      # Two seed maker checks (make seeds) run in private namespaces of their own, which Ubuntu's AppArmor keeps
      # unprivileged users from making; this throwaway runner allows them, before the first check that needs them.
      - name: allow private namespaces for the checks that make them
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: make check
        run: make check
      - name: the checks written in Herbert
        run: make answers
      - name: the window checks written in Herbert
        run: make hands
      - name: the seed maker's checks written in Herbert
        run: make seeds
      - name: the compiler's command-line checks written in Herbert
        run: make cli
      - name: Scope's helper's checks written in Herbert
        run: make helper
      # What a failed check leaves, packed into one archive and kept for two weeks.
      - name: pack test evidence
        if: always()
        run: |
          shopt -s nullglob
          evidence=(
            /tmp/herbert-answers.*
            /tmp/herbert-hands-*
            /tmp/herbert-seeds-*
            /tmp/herbert-cli-*
            /tmp/herbert-helper-*
            /tmp/herbert-scans-*
            /tmp/herbert-source-check.*
          )
          if [ "${#evidence[@]}" -gt 0 ]; then
            tar -C /tmp -czf /tmp/hosted-application-evidence.tar.gz -- "${evidence[@]#/tmp/}"
          fi
      - name: retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-application-evidence
          path: /tmp/hosted-application-evidence.tar.gz
          if-no-files-found: ignore
          retention-days: 14
