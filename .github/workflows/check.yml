name: check

on:
  push:
  pull_request:

jobs:
  check:
    # Match the explicit kernel workflow image; package versions below are
    # observed in each run, not guessed or claimed as locked dependencies.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: install independent test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3 time xxd xvfb libx11-6 libxtst6 gdb strace binutils
      - name: record actual hosted test environment
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          dpkg-query -W -f='${Package}=${Version}\n' \
            bash coreutils build-essential make gcc libc6 python3 time xxd \
            xvfb libx11-6 libxtst6 gdb strace binutils
          /usr/bin/time --version
          python3 --version
          cc --version
          make --version
          gdb --version
          strace --version
          as --version
          ld --version
      - name: make check
        run: make check
      - name: verification helpers
        run: make verification-helpers
      - name: developer program build contract
        run: make program-contract
      - name: timeout shim
        run: make test-timeout
      - name: make test
        run: make test
      - name: compiler metadata resource regression
        run: make compiler-metadata
      - name: Herbert interactive desktop and sustained memory
        run: make check-desktop
      - name: Herbert reusable map, text and atomic-file support
        run: make check-app-support
      - name: Herbert maze and notes interaction and sustained memory
        run: make check-hosted-apps
      - name: compiler invocation fault contract
        run: make compiler-cli-contract
      # verify-local suites CI historically skipped (2026-07-03 canon-cleanup, §4). The
      # emulator-free ones run here; native-codegen-diagnostics needs QEMU so it runs in
      # kernel-codegen-l1.yml.
      - name: error-vocab-native (C-free front-end error vocabulary + mutation)
        run: make error-vocab-native
      - name: lexer-copy-sync (copied lexer blocks match the fragment contract)
        run: make lexer-copy-sync
      # The evidence is packed into one tar archive before upload because the
      # program-build contract deliberately retains probe files whose names carry
      # shell metacharacters (for example "$(shell printf expanded > SOURCE_EXPANDED).herb"),
      # and actions/upload-artifact refuses such names outright.
      - name: pack hosted application test evidence
        if: always()
        run: |
          shopt -s nullglob
          evidence=(
            /tmp/herbert-hosted-apps-*
            /tmp/herbert-notes-support-*
            /tmp/herbert-x11-text-check-*
            /tmp/herbert-desktop-check-*
            /tmp/herbert-grid-map-*
            /tmp/herbert-program-build-*
            /tmp/herbert-conformance.*
            /tmp/herbert-stdin-contract.*
            /tmp/herbert-cli-contract.*
            /tmp/herbert-hosted-memory-*
            /tmp/compiler-metadata-*
            /tmp/herbert-source-check.*
          )
          if [ "${#evidence[@]}" -gt 0 ]; then
            tar -C /tmp -czf /tmp/hosted-application-evidence.tar.gz -- "${evidence[@]#/tmp/}"
          fi
      - name: retain hosted application test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-application-evidence
          path: /tmp/hosted-application-evidence.tar.gz
          if-no-files-found: ignore
          retention-days: 14
